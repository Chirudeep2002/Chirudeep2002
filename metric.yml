name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  github-metrics:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          user: Chirudeep2002

          template: classic

          base: header, activity, community, repositories

          plugin_languages: yes
          plugin_languages_limit: 8

          plugin_isocalendar: yes

          plugin_habits: yes

          plugin_followup: yes

          plugin_stars: yes
